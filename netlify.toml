[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # always check for a newer file (cheap: Netlify answers with ETags), so updates show up straight away
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/presentations/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
